name: "Validate Plan JSONs"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: "Validate All Plan JSONs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tf-blast
        run: |
          echo "Installing tf-blast..."
          INSTALL_DIR="$HOME/.local/bin"
          TMP_DIR=$(mktemp -d)
          mkdir -p "$INSTALL_DIR"
          curl -sSL \
            https://github.com/smford/tf-blast/releases/latest/download/tf-blast_linux_amd64.tar.gz \
            | tar xz -C "$TMP_DIR"
          mv "$TMP_DIR/tf-blast" "$INSTALL_DIR/tf-blast"
          chmod +x "$INSTALL_DIR/tf-blast"
          rm -rf "$TMP_DIR"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          "$INSTALL_DIR/tf-blast" --version

      - name: Validate all plan JSONs
        id: validate
        run: |
          set +e  # don't exit on first failure — collect all results
          PASS=0
          FAIL=0
          FAIL_LIST=""

          for plan in $(find scenarios -name "plan*.json" | sort); do
            printf "  %-65s " "$plan"

            # Use --silent to suppress output; we only care about parse errors (exit 2)
            # Policy failures (exit 1) are expected for some scenarios and are valid plans
            tf-blast --silent "$plan" 2>/tmp/tf-blast-err.txt
            CODE=$?

            if [ "$CODE" -eq 2 ]; then
              echo "PARSE ERROR"
              cat /tmp/tf-blast-err.txt
              FAIL=$((FAIL+1))
              FAIL_LIST="$FAIL_LIST\n  - $plan"
            else
              echo "OK (exit $CODE)"
              PASS=$((PASS+1))
            fi
          done

          echo ""
          echo "Results: $PASS passed, $FAIL failed"

          if [ "$FAIL" -gt 0 ]; then
            echo ""
            echo "Failed plans:$FAIL_LIST"
            exit 1
          fi

      - name: Validate policy configs
        run: |
          echo "Validating .tf-blast.yaml configs parse correctly..."
          for cfg in .tf-blast.yaml configs/*.yaml configs/*.yml; do
            [ -f "$cfg" ] || continue
            printf "  %-50s " "$cfg"
            # Run against a known-good plan with the config — exit 0 or 1 both mean config parsed OK
            tf-blast --silent --config "$cfg" scenarios/01-greenfield-vpc/plan.json 2>/tmp/cfg-err.txt
            CODE=$?
            if [ "$CODE" -eq 2 ]; then
              echo "CONFIG ERROR"
              cat /tmp/cfg-err.txt
              exit 1
            else
              echo "OK"
            fi
          done
          echo "All configs valid."
